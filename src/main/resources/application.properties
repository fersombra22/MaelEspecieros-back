# =====================================================
# SERVIDOR
# =====================================================

server.port=8080
spring.threads.virtual.enabled=true



# =====================================================
# SQLITE DATABASE & HIKARI POOL
# =====================================================

spring.datasource.url=jdbc:sqlite:maelespecieros.db

spring.datasource.driver-class-name=org.sqlite.JDBC

spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000;

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.idle-timeout=30000

spring.datasource.hikari.max-lifetime=1800000



# =====================================================
# JPA
# =====================================================

spring.jpa.hibernate.ddl-auto=none

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.data.web.pageable.serialization-mode=direct



# =====================================================
# FLYWAY
# =====================================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration



# =====================================================
# TIMEZONE
# =====================================================

spring.jackson.time-zone=America/Argentina/Buenos_Aires

spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires



# =====================================================
# JWT SECURITY
# =====================================================

jwt.secret=${JWT_SECRET:MaelEspecierosJWTSecretProduccion2026Seguro}

jwt.expiration=28800000

# =====================================================
# ARTIFICIAL INTELLIGENCE (GEMINI)
# =====================================================

gemini.api.key=${GEMINI_API_KEY:su_clave_api_gemini_aqui}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

# =====================================================
# CORS SECURITY
# =====================================================

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}



# =====================================================
# BLOCKCHAIN SECURITY
# =====================================================

blockchain.hmac.secret=${BLOCKCHAIN_SECRET:MaelBlockchainSecretProduccion2026}



logging.level.org.springframework.security=INFO

logging.level.com.maelespecieros.backend=DEBUG

# =====================================================
# MAIL (SMTP) CONFIGURATION
# =====================================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:ventas@maelespecieros.com}
management.health.mail.enabled=false

# =====================================================
# SWAGGER & OPENAPI CONFIGURATION
# =====================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
